# Serves the built page, and passes everything under /api on to the API.
# The browser talks to one address only, so the API needs no CORS.
server {
  listen 80;
  root /usr/share/nginx/html;

  # The script and the stylesheet are text: send them compressed.
  gzip on;
  gzip_types text/css application/javascript;

  # Files in /assets have a hash of their content in their name, so a browser
  # may keep them for good. index.html names them, so it is checked each time:
  # a page that was built again shows up on the next reload.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    add_header Cache-Control "no-cache";
  }

  location /api/ {
    # Ask Docker's DNS for the address of the API when a call comes in (the
    # answer is kept for 5 seconds), not once at start. With the name in a
    # variable nginx does that. So the page works again by itself after the
    # API container was built again and got another address.
    resolver 127.0.0.11 valid=5s;
    set $api http://api:8080;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api;
  }
}
