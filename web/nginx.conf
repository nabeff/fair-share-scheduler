# Serves the page and proxies /api, so no CORS is needed.
server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript;

  # Hashed assets are cached forever, index.html never.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    add_header Cache-Control "no-cache";
  }

  location /api/ {
    # A variable makes nginx resolve the API per request, so a rebuilt
    # API container with a new IP still works.
    resolver 127.0.0.11 valid=5s;
    set $api http://api:8080;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api;
  }
}
