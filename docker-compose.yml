# Settings shared by every process built from this repo.
x-app: &app
  build: .
  environment:
    DATABASE_URL: postgres://postgres:postgres@db:5432/scheduler
  depends_on:
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scheduler
    # Published on an unusual host port so it never clashes with a Postgres
    # already running on the machine. Only tests run from the host need it,
    # so it is reachable from this machine only.
    ports:
      - "127.0.0.1:${DB_PORT:-54329}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Checked over TCP on purpose. While the image sets up a new volume, a
    # temporary server answers on the unix socket only, and the migration
    # must not start before the real server is up.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d scheduler"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Creates the tables and seeds tenants.json, then exits. Everything else waits for it.
  migrate:
    build: .
    command: ["node", "src/migrate.ts"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/scheduler
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    command: ["node", "src/api.ts"]
    ports:
      - "${API_PORT:-8080}:8080"

  # Decides which tenant runs next. A second replica would act as a standby.
  scheduler:
    <<: *app
    command: ["node", "src/scheduler.ts"]

  # Several separate worker processes. Each one runs up to WORKER_SLOTS jobs at once.
  worker:
    <<: *app
    command: ["node", "src/worker.ts"]
    deploy:
      replicas: 4

  # All tests, in a database of their own:  docker compose run --rm test
  test:
    <<: *app
    command: ["npm", "test"]
    profiles: ["tools"]
    pull_policy: build # always run the current code
    restart: "no"

  # The load test. It empties the job table, then prints its report and
  # writes it to ./results:  docker compose run --rm loadtest
  # One scenario only:       docker compose run --rm loadtest flood
  loadtest:
    <<: *app
    entrypoint: ["node", "scripts/loadtest.ts"]
    profiles: ["tools"]
    pull_policy: build # always run the current code
    restart: "no"
    user: root # so it can write into the mounted ./results on any host
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/scheduler
      API_URL: http://api:8080
    volumes:
      - ./results:/app/results
    depends_on: [api, scheduler, worker]

volumes:
  pgdata:
