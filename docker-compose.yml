# Settings shared by every process built from this repo.
x-app: &app
  build: .
  environment:
    DATABASE_URL: postgres://postgres:postgres@db:5432/scheduler
  depends_on:
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scheduler
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scheduler"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Creates the tables and seeds tenants.json, then exits. Everything else waits for it.
  migrate:
    build: .
    command: ["node", "src/migrate.ts"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/scheduler
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    command: ["node", "src/api.ts"]
    ports:
      - "${API_PORT:-8080}:8080"

  # Decides which tenant runs next. A second replica would act as a standby.
  scheduler:
    <<: *app
    command: ["node", "src/scheduler.ts"]

  # Several separate worker processes. Each one runs up to WORKER_SLOTS jobs at once.
  worker:
    <<: *app
    command: ["node", "src/worker.ts"]
    deploy:
      replicas: 4

volumes:
  pgdata:
