x-app: &app
  build: .
  environment:
    DATABASE_URL: postgres://postgres:postgres@db:5432/scheduler
  depends_on:
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scheduler
    # Odd port to avoid a local Postgres. Localhost only, for tests.
    ports:
      - "127.0.0.1:${DB_PORT:-54329}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # TCP, not the socket: on first start a temporary server answers the socket.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d scheduler"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Creates the tables, loads tenants.json, exits.
  migrate:
    build: .
    command: ["node", "src/migrate.ts"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/scheduler
      # Schema changes may need more than the usual 5 s.
      DB_TIMEOUT_MS: "600000"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    command: ["node", "src/api.ts"]
    ports:
      - "${API_PORT:-8080}:8080"

  # A second replica would be a standby.
  scheduler:
    <<: *app
    command: ["node", "src/scheduler.ts"]

  # 4 processes x WORKER_SLOTS jobs each.
  worker:
    <<: *app
    command: ["node", "src/worker.ts"]
    deploy:
      replicas: 4

  # Live page, http://localhost:8090. Optional, just another API client.
  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8090}:80"
    depends_on: [api]
    restart: unless-stopped

  # docker compose run --rm test
  test:
    <<: *app
    command: ["npm", "test"]
    profiles: ["tools"]
    pull_policy: build # always run the current code
    restart: "no"

  # docker compose run --rm web-test
  web-test:
    build:
      context: ./web
      target: source
    command: ["npm", "test"]
    profiles: ["tools"]
    pull_policy: build # always run the current code
    restart: "no"

  # docker compose run --rm loadtest [flood|weights]
  # Empties the job table, writes the report to ./results.
  loadtest:
    <<: *app
    entrypoint: ["node", "scripts/loadtest.ts"]
    profiles: ["tools"]
    pull_policy: build # always run the current code
    restart: "no"
    user: root # to write into ./results
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/scheduler
      API_URL: http://api:8080
    volumes:
      - ./results:/app/results
    depends_on: [api, scheduler, worker]

volumes:
  pgdata:
