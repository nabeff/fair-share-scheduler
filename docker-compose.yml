services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scheduler
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scheduler"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Creates the tables and seeds tenants.json, then exits. Everything else waits for it.
  migrate:
    build: .
    command: ["node", "src/migrate.ts"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/scheduler
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
